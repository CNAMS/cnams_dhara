name: nightly

on:
  schedule:
    # 02:00 UTC. Nothing depends on the exact hour; a fixed one makes the runs
    # comparable night to night.
    - cron: "0 2 * * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: dhara-py

jobs:
  gate-budget:
    # The full property budget is a gate measurement, not a per-push cost.
    # Running it on every push would make the loop unusable and would not find
    # anything a nightly run misses within a week. Same tiering as the
    # simulator's seed corpus - see plan/ci-and-tooling.md section 4.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups

      - name: Algebraic laws at the phase-exit budget
        env:
          DHARA_LAW_EXAMPLES: "10000"
        run: uv run pytest -q -m property

      - name: Conformance vectors
        run: uv run pytest -q -m conformance

  mutation-experiment:
    # Harness sensitivity decays and nothing else reports it. A refactor that
    # makes the scenario generator less adversarial breaks no test except this
    # one - so it runs every night at the full budget, not once at phase exit.
    # See docs/deliberate-bug-experiment.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups

      - name: Deliberate-bug experiment at the full budget
        env:
          DHARA_MUTATION_BUDGET: "1000"
        run: uv run pytest -q tests/sim/test_mutations.py

  seed-sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups

      - name: Sweep shard ${{ matrix.shard }}
        run: |
          uv run python -m sim.runner \
            --start $(( ${{ matrix.shard }} * 25000 + 1 )) \
            --seeds 25000 \
            --progress 5000

      - name: Upload failing scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-failures-${{ matrix.shard }}
          path: dhara-py/sim-out/
